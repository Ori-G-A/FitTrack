name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec node scripts/run-clock-state-checkpoint.js proofs
      - run: pnpm test:sdd:complete
      - run: pnpm run test:sdd:complete --spec=003-entrenamiento
      - run: pnpm run test:sdd:complete --spec=004-nutricion-objetivos
      - run: pnpm run test:sdd:complete --spec=005-cuerpo-ciclo
      - run: pnpm run test:sdd:complete --spec=006-interfaz
      - run: pnpm run test:sdd:complete --spec=007-guardado-fiable
      - run: pnpm run test:sdd:complete --spec=008-borrado-fiable
      - run: pnpm run test:sdd:complete --spec=009-reloj-pruebas
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidencia-sdd-009
          path: |
            test-results/sdd-009-reloj-pruebas-evidence.json
            test-results/sdd-009-reloj-pruebas-pilot.tap
            test-results/sdd-009-reloj-pruebas-browser.json
            test-results/clock009-proof-receipts.json
            test-results/clock009-mutations.json
            test-results/clock009-mutation-*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidencia-sdd-008
          path: |
            test-results/sdd-008-borrado-fiable-evidence.json
            test-results/sdd-008-borrado-fiable-pilot.tap
            test-results/sdd-008-borrado-fiable-browser.json
            test-results/delete008-mutations.json
            test-results/delete008-mutation-*.tap
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidencia-sdd-007
          path: |
            test-results/sdd-007-guardado-fiable-evidence.json
            test-results/sdd-007-guardado-fiable-pilot.tap
            test-results/sdd-007-guardado-fiable-browser.json
            test-results/save007-mutations.json
            test-results/save007-mutation-*.tap
            test-results/save007-mutation-*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidencia-sdd-006
          path: |
            test-results/sdd-006-interfaz-evidence.json
            test-results/sdd-006-interfaz-pilot.tap
            test-results/sdd-006-interfaz-browser.json
            test-results/interface-postgreen-mutations.json
            test-results/sdd-browser.json
            test-results/sdd-pilot.tap
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidencia-sdd-003
          path: |
            test-results/sdd-003-entrenamiento-evidence.json
            test-results/sdd-003-entrenamiento-pilot.tap
            test-results/sdd-003-entrenamiento-browser.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidencia-sdd-004
          path: |
            test-results/sdd-004-nutricion-objetivos-evidence.json
            test-results/sdd-004-nutricion-objetivos-pilot.tap
            test-results/sdd-004-nutricion-objetivos-browser.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidencia-sdd-005
          path: |
            test-results/sdd-005-cuerpo-ciclo-evidence.json
            test-results/sdd-005-cuerpo-ciclo-pilot.tap
            test-results/sdd-005-cuerpo-ciclo-browser.json
          if-no-files-found: ignore

  rls-and-sdd-002:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.121.0
      - run: pnpm test:rls
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:sdd:complete --spec=002-identidad-fotos
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidencia-sdd-002
          path: |
            test-results/rls-evidence.json
            test-results/rls.tap
            test-results/sdd-002-identidad-fotos-evidence.json
          if-no-files-found: ignore
