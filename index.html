<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack</title>
    <!-- Fondo antes de que React monte: sin esto la carga es un flash blanco
         sobre una app oscura. La preferencia guardada corrige a claro si toca. -->
    <style>html{background:#17150f;color-scheme:dark}html[data-theme="light"]{background:#f3efe6;color-scheme:light}body{margin:0}</style>
    <script>
      try {
        var p = localStorage.getItem("ft-theme") || "dark";
        var dark = p === "dark" || (p === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) { /* almacenamiento bloqueado: se queda en oscuro */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
